name: Atualizar painel

on:
  schedule:
    # A cada 15 minutos, das 8h às 20h no horário de Brasília (11h–23h UTC).
    # O GitHub às vezes atrasa execuções agendadas em alguns minutos.
    - cron: "*/15 11-23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Histórico das entregas (data em que cada card apareceu como feito). Fica no cache do GitHub,
      # que não é público, para não expor os nomes das tarefas no repositório.
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: historico-${{ github.run_id }}
          restore-keys: historico-

      - name: Buscar dados no ClickUp e gerar a página
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python3 scripts/build.py

      - uses: actions/cache/save@v4
        with:
          path: estado
          key: historico-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Proteger a página com senha
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          test -n "$PAGE_PASSWORD" || { echo "Falta o segredo PAGE_PASSWORD"; exit 1; }
          npx --yes staticrypt@3.5.4 dist/index.html \
            -p "$PAGE_PASSWORD" \
            -s a8cda99b3b56ddd491a7be0d1108170c \
            -d public \
            -t site/senha.html \
            --short \
            --remember 30 \
            --template-title "Desempenho de Produtividade Audiovisual" \
            --template-instructions "Entre com a senha do painel" \
            --template-placeholder "Digite a senha" \
            --template-remember "Lembrar neste navegador por 30 dias" \
            --template-button "Entrar" \
            --template-error "Senha incorreta. Tente de novo." \
            --template-toggle-show "Mostrar senha" \
            --template-toggle-hide "Ocultar senha"
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
